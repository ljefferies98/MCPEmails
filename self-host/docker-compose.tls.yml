# Optional public HTTPS entrypoint. Use only with a DNS name you control.
#
# Start it with:
#   MCP_PUBLIC_HOST=mcp.example.com \
#   APP_URL=https://mcp.example.com \
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#
# Caddy obtains and renews a publicly trusted certificate automatically and
# reaches the MCP server over the private compose network; the server itself
# publishes no host port in this mode. (Not needed on Coolify, whose proxy
# already terminates TLS for the domain you assign to mcp-server.)
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - mcp-server
    environment:
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:?set MCP_PUBLIC_HOST to your DNS name}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
